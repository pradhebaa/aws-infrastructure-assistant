
name: EC2 Agent CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check Python files
        run: python -m compileall -q src

      - name: Verify application imports
        env:
          PYTHONPATH: src
        run: |
          python -c "from tools.ec2 import get_ec2_instances, get_instance_name; print('EC2 tools imported successfully')"
